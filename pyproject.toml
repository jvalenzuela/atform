[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"


[project]
name = "atform"
description = "Acceptance test procedure form generator."
readme = "README.md"
authors = [
    {name = "Jason Valenzuela"},
    {email = "jvalenzuela1977@gmail.com"},
]
license = {file = "LICENSE.txt"}
dynamic = ["version"]

# doc/source/intro.rst, .github/workflow/release.yaml, and the classifiers list
# below need to match this.
# Range of versions is equivalent to those supported by Reportlab.
#
# 3.14 is limited at 3.14.4 due to TclError exceptions when calling
# tkfont.nametofont("TkDefaultFont") during unit tests. These exceptions
# were unique to macOS Github runners using Python 3.14.5 or later,
# likely due Tcl/Tk 9.0.3 update for macOS in that Python version.
# It is unknown if this problem applies only to the headless environment
# of the Github runners, but the 3.14.4 limit was applied globally, i.e.,
# both in the Github action script and here, just to be safe.
requires-python = ">= 3.10, <= 3.14.4"

dependencies = [
    "reportlab>=4.2.0",
    "pillow",
    "pymupdf>=1.19.2",  # Minimum version for Page.get_pixmap() dpi parameter.
    "svglib",
    "whoosh",
]

classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing :: Acceptance",
    "Topic :: Text Processing :: Markup",
]


[project.urls]
Homepage = "https://github.com/jvalenzuela/atform"
Repository = "https://github.com/jvalenzuela/atform.git"
Issues = "https://github.com/jvalenzuela/atform/issues"


[tool.hatch.version]
path = "atform/version.py"
